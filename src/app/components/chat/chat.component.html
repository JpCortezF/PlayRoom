<div class="fixed bottom-5 right-5 z-50">
  <!-- Ventana flotante de chat -->
  <div *ngIf="showChat" class="absolute bottom-16 right-0 w-[400px] min-h-[400px] bg-white border rounded-lg shadow-lg flex flex-col overflow-hidden">
    <div class="px-4 py-2 text-sm text-gray-600 font-medium border-b">
      {{ welcomeMessage }}
    </div>
    <!-- Área de mensajes -->
    <div class="flex-1 p-4 overflow-y-auto text-sm text-gray-700 space-y-3 max-h-96">
      <div *ngFor="let group of groupedMessages">
        <!-- Separador de fecha -->
        <div class="flex justify-center my-4">
          <span class="bg-gray-200 text-xs text-gray-600 px-2 py-1 rounded-full">
            {{ group.date }}
          </span>
        </div>
        
        <div *ngFor="let msg of group.messages">
          <div class="flex items-start gap-2" [ngClass]="{'justify-end': msg.user_id === currentUser.id}">
            <ng-container *ngIf="msg.user_id !== currentUser.id; else ownMessage">
              <div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center">
                <span class="text-sm font-medium text-white">
                  {{ msg.users?.initials || '?' }}
                </span>
              </div>
              <div>
                <p class="text-xs font-semibold text-gray-600">{{ msg.users?.username || 'Usuario' }}</p>
                <div class="bg-gray-200 rounded-lg px-3 py-2 text-gray-800 max-w-[200px] relative pr-10">
                  {{ msg.message }}
                  <span class="text-[10px] text-gray-500 absolute bottom-1 right-2 whitespace-nowrap pl-2">
                    {{ msg.created_at | date:'HH:mm' }}
                  </span>
                </div>
              </div>
            </ng-container>

            <!-- Mensaje propio -->
            <ng-template #ownMessage>
              <div class="text-right ml-auto">
                <p class="text-xs font-semibold text-blue-600">Yo</p>
                <div class="bg-blue-100 rounded-lg px-3 py-2 text-blue-800 max-w-[200px] relative pr-10">
                  {{ msg.message }}
                  <span class="text-[10px] text-gray-500 absolute bottom-1 right-2 whitespace-nowrap pl-2">
                    {{ msg.created_at | date:'HH:mm' }}
                  </span>
                </div>
              </div>
            </ng-template>
          </div>
        </div>
      </div>
    </div>

    <!-- Input del mensaje -->
    <div class="flex items-center border-t p-2 bg-gray-50">
      <textarea
        [(ngModel)]="message"
        (keydown.enter)="sendMessage()"
        class="flex-1 resize-none border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring focus:border-blue-300"
        rows="1"
        placeholder="Escribe un mensaje..."
      ></textarea>
      <button
        (click)="sendMessage()"
        class="ml-2 text-blue-500 hover:text-blue-700 p-2 rounded-full"
        title="Enviar"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Botón flotante -->
  <button
    (click)="toggleChat()"
    class="bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-full p-4 shadow-xl hover:scale-105 transition-all duration-300 ease-in-out focus:outline-none group"
    aria-label="Abrir chat"
  > 💬 </button>
</div>
