<div class="fixed bottom-5 right-5 z-50">
  <!-- Ventana flotante de chat -->
  <div *ngIf="showChat" class="absolute bottom-16 right-0 w-[400px] min-h-[400px] bg-white border rounded-lg shadow-lg flex flex-col overflow-hidden">
    <div class="px-4 py-2 text-sm text-gray-600 font-medium border-b">
      {{ welcomeMessage }}
    </div>

  <!-- Área de mensajes -->
  <div class="flex-1 p-4 overflow-y-auto text-sm text-gray-700 space-y-3 max-h-96">
    <div *ngFor="let group of groupedMessages">
      <!-- Separador de fecha -->
      <div class="flex justify-center my-4">
        <span class="bg-gray-200 text-xs text-gray-600 px-2 py-1 rounded-full">
          {{ group.date }}
        </span>
      </div>
      
      <div *ngFor="let msg of group.messages">
        <div class="flex items-start gap-2" [ngClass]="{'justify-end': msg.user_id === currentUser.id}">
          <!-- Mensajes recibidos -->
          <ng-container *ngIf="msg.user_id !== currentUser.id; else ownMessage">
            <div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center shrink-0">
              <span class="text-sm font-medium text-white">
                {{ msg.users?.initials || '?' }}
              </span>
            </div>
            <div class="flex flex-col max-w-[85%]">
              <p class="text-xs font-semibold text-gray-600 mb-1">{{ msg.users?.username || 'Usuario' }}</p>
              <div class="bg-gray-200 rounded-lg px-3 py-2 text-gray-800 max-w-[300px] relative break-words">
                <div class="whitespace-pre-wrap" [innerHTML]="formatMessage(msg.message)"></div>
                <span class="text-[10px] text-gray-500 absolute bottom-0 right-2 whitespace-nowrap">
                  {{ msg.formattedTime }}
                </span>
              </div>
            </div>
          </ng-container>

          <!-- Mensajes propios -->
          <ng-template #ownMessage>
            <div class="flex flex-col max-w-[85%] items-end">
              <p class="text-xs font-semibold text-blue-600 mb-1">Yo</p>
              <div class="bg-blue-100 rounded-lg px-3 py-2 text-blue-800 relative break-words max-w-[300px]">
                <div class="whitespace-pre-wrap" [innerHTML]="formatMessage(msg.message)"></div>
                <span class="text-[10px] text-gray-500 absolute bottom-0 right-2 whitespace-nowrap">
                  {{ msg.formattedTime }}
                </span>
              </div>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>

    <!-- Input del mensaje -->
    <div class="p-4 border-t border-gray-200">
      <!-- Mensaje del sistema para no logueados -->
      <div *ngIf="!currentUser" class="flex justify-center mb-2">
        <div class="bg-gray-200 rounded-lg px-3 py-2 text-gray-800 max-w-[80%] text-center text-xs">
          Debes tener una cuenta para unirte a la comunidad!
        </div>
      </div>  
      <div class="flex items-center gap-2">
        <input 
          [(ngModel)]="message" 
          (keydown.enter)="sendMessage()"
          [disabled]="!currentUser"
          placeholder="Escribe un mensaje..."
          class="flex-1 border border-gray-300 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
        >
        <button 
          (click)="sendMessage()"
          [disabled]="!currentUser"
          class="w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Botón flotante -->
  <button
    (click)="toggleChat()"
    class="bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-full p-4 shadow-xl hover:scale-105 transition-all duration-300 ease-in-out focus:outline-none group"
    aria-label="Abrir chat"
  > 💬 </button>
</div>
