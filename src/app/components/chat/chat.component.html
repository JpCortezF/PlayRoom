<div class="fixed bottom-5 right-5 z-50">
  <!-- Ventana flotante de chat -->
  <div *ngIf="showChat" class="absolute bottom-16 right-0 w-80 bg-white border rounded-lg shadow-lg flex flex-col overflow-hidden">
    <!-- Área de mensajes -->
    <div class="flex-1 p-4 overflow-y-auto text-sm text-gray-700">
      <p class="text-gray-400 italic">Aquí aparecerán los mensajes...</p>
    </div>

    <!-- Input del mensaje -->
    <div class="flex items-center border-t p-2 bg-gray-50">
      <textarea
        [(ngModel)]="message"
        class="flex-1 resize-none border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring focus:border-blue-300"
        rows="1"
        placeholder="Escribe un mensaje..."
      ></textarea>
      <button
        (click)="sendMessage()"
        class="ml-2 text-blue-500 hover:text-blue-700 p-2 rounded-full"
        title="Enviar"
      >
        <!-- Flechita (ícono de enviar) -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>
  <!-- Botón flotante -->
  <button
    (click)="toggleChat()"
    class="bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-full p-4 shadow-xl hover:scale-105 transition-all duration-300 ease-in-out focus:outline-none group"
    aria-label="Abrir chat"
  > 💬 
  </button>
</div>
