<div class="atropo-scale mx-auto flex flex-col items-center m-4 group hover:-translate-y-1 transition-all duration-300 ease-in-out">
  <div class="rounded-lg overflow-hidden hover:shadow-[0_0_25px_8px_rgba(0,0,0,0.8)] transition-shadow">
    <a [routerLink]="'/games/' + gameRoute.toLowerCase()">
      <img
        class="w-full h-40 md:h-52 object-contain rounded-xl cursor-pointer"
        [src]="imageUrl"
        alt="imagen del juego {{gameName}}" 
      />
    </a>
  </div>

  <div class="p-4 text-center">
    <h2 class="text-xl font-semibold text-gray-200 group-hover:text-white transition-colors">
      {{ gameName}}
    </h2>
    <div class="mt-2 h-0.5 w-0 mx-auto bg-blue-400 group-hover:w-16 transition-all duration-500"></div>
  </div>
</div>
