<nav class="bg-gradient-to-r from-gray-900 via-gray-800 to-gray-900 border-gray-200 shadow-xl">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto pb-2 pt-2">
    <!-- Logo y marca -->
    <a routerLink="/" class="flex items-center space-x-3 rtl:space-x-reverse">
      <img [src]="iconUrl" class="h-10" alt="Logo PlayRoom" />
      <span class="self-center text-xl font-semibold whitespace-nowrap text-white">PlayRoom</span>
    </a>

    <!-- Botón móvil -->
    <button data-collapse-toggle="navbar-user" type="button" 
            class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-400 rounded-lg md:hidden hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-600"
            aria-controls="navbar-user">
      <span class="sr-only">Abrir menú</span>
      <svg class="w-5 h-5" aria-hidden="true" fill="none" viewBox="0 0 17 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
      </svg>
    </button>

    <!-- Contenido del navbar -->
    <div class="hidden w-full md:block md:w-auto" id="navbar-user">
      <ul class="flex flex-col font-normal p-4 md:p-0 mt-4 rounded-lg md:space-x-8 md:flex-row md:mt-0">
        <!-- Enlaces principales -->
        <li>
          <a routerLink="/" class="block py-2 px-3 text-white hover:text-gray-300 rounded-lg hover:bg-gray-700">Inicio</a>
        </li>
        <li>
          <a routerLink="/about-me" class="block py-2 px-3 text-white hover:text-gray-300 rounded-lg hover:bg-gray-700">Quien soy</a>
        </li>

        <!-- Autenticación -->
        @if(authService.currentUser === null) {
          <li>
            <a routerLink="/login" class="block py-2 px-3 text-white hover:text-gray-300 rounded-lg hover:bg-gray-700">
              Iniciar Sesión
            </a>
          </li>
        } @else {
          <li class="relative">
            <!-- Avatar + Flechita en línea -->
            <button id="userDropdownButton" 
                    data-dropdown-toggle="userDropdown"
                    class="flex items-center gap-1 py-1 px-2 text-white rounded-lg hover:bg-gray-700 focus:outline-none group">
              
              <!-- Avatar o iniciales -->
              @if(userloggedIn.avatar_url) {
                <img class="w-8 h-8 rounded-full" 
                     [src]="userloggedIn.avatar_url" 
                     alt="Avatar de {{ userloggedIn.username }}">
              } @else {
                <div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center">
                  <span class="text-sm font-medium text-gray-300">
                    {{ userloggedIn.initials }}
                  </span>
                </div>
              }
          
              <!-- Flechita a la derecha del avatar -->
              <svg class="w-3 h-3 text-white transition-transform duration-200 group-data-[dropdown-open=true]:rotate-180" 
                   xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1l4 4 4-4"/>
              </svg>
            </button>
          
            <!-- Dropdown Menu -->
            <div id="userDropdown" 
                 class="z-50 hidden absolute right-0 font-normal bg-gray-800 divide-y divide-gray-700 rounded-lg shadow w-44 mt-2">
              <div class="px-4 py-3">
                <span class="block text-sm text-white">{{ userloggedIn.username }}</span>
              </div>
              <ul class="py-1 text-sm text-gray-200" aria-labelledby="userDropdownButton">
                <li>
                  <a (click)="logout()" 
                     class="block px-4 py-2 hover:bg-gray-700 cursor-pointer">
                    Cerrar sesión
                  </a>
                </li>
              </ul>
            </div>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
