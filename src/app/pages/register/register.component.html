<div class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md bg-gray-800 rounded-2xl p-8 shadow-lg backdrop-blur-sm">
    <h1 class="text-3xl font-bold text-white text-center mb-12 relative pb-2">
      Creá tu cuenta
      <span class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-20 h-1 bg-red-500 rounded-full"></span>
    </h1>
    <div class="space-y-5">
      <!-- Email -->
      <div class="flex items-center bg-gray-700 rounded px-2 py-1 transition-all duration-300 focus-within:ring-2 focus-within:ring-red-500">
        <i class="fas fa-envelope text-red-500 mr-3"></i>
        <input type="email" [(ngModel)]="newUserMail" name="newEmail" placeholder="Email" class="w-full bg-transparent text-white placeholder-gray-400 outline-none border-0"
        (blur)="validateForm()"
        (keyup.enter)="Register()">
      </div>
      @if (errorMessages.email) {
        <p class="text-red-400 text-sm h[10px]">{{ errorMessages.email }}</p>
      }
      <!-- Password -->
      <div class="flex items-center bg-gray-700 rounded px-2 py-1 transition-all duration-300 focus-within:ring-2 focus-within:ring-red-500">
        <i class="fas fa-lock text-red-500 mr-3"></i>
        <input type="password" [(ngModel)]="newUserPass" name="newPassword" placeholder="Contraseña" class="w-full bg-transparent text-white placeholder-gray-400 outline-none border-0"
        (blur)="validateForm()"
        (keyup.enter)="Register()">
      </div>
      @if (errorMessages.password) {
        <p class="text-red-400 text-sm h[10px]">{{ errorMessages.password }}</p>
      }
      @if (errorMessages.general) {
        <p class="text-red-400 text-center">{{ errorMessages.general }}</p>
      }
      <!-- Buttons -->
      <div class="flex justify-center space-x-3 pt-4">
        <button (click)="Register()" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded transition-colors">
          Crear cuenta
        </button>
      </div>
      <div class="text-center pt-4">
        <span class="text-gray-300 text-sm">¿Ya tienes cuenta?</span>
        <a routerLink="/login" class="ml-2 text-red-400 hover:text-white cursor-pointer transition-colors">
          INICIAR SESIÓN
        </a>
      </div>
    </div>
  </div>
</div>
